# À créer sur GitHub sous le nom exact : .github/workflows/robot.yml
name: Robot du jour

on:
  schedule:
    - cron: "30 2 * * *"   # chaque nuit vers 4 h 30, heure de Paris
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python robot.py
      - name: Enregistrer les nouveautés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Rien de neuf"
          else
            git commit -m "Cartes du jour"
            git push
          fi
